<!-- YouTube動画情報の自動取得（GAS） -->
<script>
(() => {
  // GASをウェブアプリとしてデプロイした後、発行URLに置き換えてください。
  const YOUTUBE_HP_GAS_URL = 'https://script.google.com/macros/s/AKfycbz_BgJJtyNiYwFjc74c5MaUr8x954jGNrhk1nfTWTIsoOW_92HNS0kB26yyOX_QJWIX/exec';
  if (!YOUTUBE_HP_GAS_URL.startsWith('https://script.google.com/')) return;

  const streamCard = document.querySelector('.hero-video-stream');
  const coverCard = document.querySelector('.hero-video-cover');
  const streamThumb = document.querySelector('.stream-thumb');
  const coverThumb = document.querySelector('.cover-thumb');

  const applyVideo = (card, thumb, video, isStream) => {
    if (!card || !thumb || !video || !video.url) return;
    card.href = video.url;
    if (video.videoId || video.id) card.dataset.videoId = video.videoId || video.id;
    if (video.channelId) card.dataset.channelId = video.channelId;
    if (video.embedUrl) card.dataset.embedUrl = video.embedUrl;
    card.title = video.title || '';
    card.setAttribute('aria-label', (video.title || (isStream ? 'Latest stream' : 'Latest cover')) + ' — ' + (video.label || ''));
    if (video.thumbnail) {
      thumb.style.backgroundImage = `linear-gradient(rgba(35,20,35,.08), rgba(35,20,35,.08)), url("${video.thumbnail}")`;
      thumb.style.backgroundSize = 'cover';
      thumb.style.backgroundPosition = 'center';
    }
    if (isStream) {
      const live = video.live === true || video.label === 'LIVE NOW';
      card.dataset.live = live ? 'true' : 'false';
    }
  };

  const callbackName = 'youtubeHpCallback_' + Math.random().toString(36).slice(2);
  const script = document.createElement('script');
  window[callbackName] = (data) => {
    if (!data || !data.ok) return;
    applyVideo(streamCard, streamThumb, data.stream, true);
    applyVideo(coverCard, coverThumb, data.cover, false);
    delete window[callbackName];
    script.remove();
  };
  script.onerror = () => { delete window[callbackName]; script.remove(); };
  script.src = YOUTUBE_HP_GAS_URL + (YOUTUBE_HP_GAS_URL.includes('?') ? '&' : '?') + 'callback=' + callbackName;
  document.head.appendChild(script);
})();
</script>


<!-- サムネイルをクリック → 再生確認 → 明示的に再生 -->
<script>
(() => {
  const stage = document.querySelector('.hero-scroll-stage');
  const cards = [...document.querySelectorAll('.hero-video-card')];
  if (!stage || !cards.length) return;

  const overlay = document.createElement('div');
  overlay.className = 'hero-video-player-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', '動画再生');
  overlay.innerHTML = `
    <div class="hero-video-confirm" data-panel="confirm">
      <span class="hero-video-confirm-title">VIDEO PLAYER</span>
      <p>この動画を再生しますか？</p>
      <div class="hero-video-confirm-actions">
        <button type="button" data-action="play">再生する</button>
        <a data-action="youtube" href="#" target="_blank" rel="noopener noreferrer">YouTubeで見る ↗</a>
        <button type="button" data-action="cancel">閉じる</button>
      </div>
    </div>
    <div class="hero-video-player-frame" data-panel="player" hidden>
      <div class="hero-video-player-actions">
        <a data-action="youtube" href="#" target="_blank" rel="noopener noreferrer">YouTubeで見る ↗</a>
        <button type="button" data-action="close" aria-label="閉じる">×</button>
      </div>
      <div data-player-host style="width:100%;height:100%"></div>
    </div>`;
  stage.appendChild(overlay);

  const confirmPanel = overlay.querySelector('[data-panel="confirm"]');
  const playerPanel = overlay.querySelector('[data-panel="player"]');
  const playerHost = overlay.querySelector('[data-player-host]');
  let selectedUrl = '';
  let selectedId = '';

  const youtubeId = (url) => {
    try {
      const u = new URL(url);
      if (u.hostname === 'youtu.be') return u.pathname.slice(1).split('/')[0];
      if (u.searchParams.get('v')) return u.searchParams.get('v');
      const parts = u.pathname.split('/').filter(Boolean);
      const marker = parts.findIndex(x => ['live', 'shorts', 'embed'].includes(x));
      return marker >= 0 ? parts[marker + 1] : '';
    } catch (_) { return ''; }
  };

  const setYoutubeLinks = (url) => overlay.querySelectorAll('[data-action="youtube"]').forEach(a => { a.href = url; });
  const openConfirm = (url) => {
    selectedUrl = url;
    selectedId = youtubeId(url) || card.dataset.videoId || '';
    setYoutubeLinks(url);
    confirmPanel.hidden = false;
    playerPanel.hidden = true;
    playerHost.replaceChildren();
    overlay.classList.add('is-open');
  };
  const close = () => {
    overlay.classList.remove('is-open');
    playerHost.replaceChildren(); // 閉じたら再生も停止
    selectedUrl = '';
    selectedId = '';
  };
  const play = () => {
    const activeCard = cards.find(card => (card.getAttribute('href') || card.href) === selectedUrl);
    const videoId = selectedId || activeCard?.dataset.videoId || '';
    const channelId = activeCard?.dataset.channelId || '';
    const explicitEmbedUrl = activeCard?.dataset.embedUrl || '';
    let embedUrl = '';

    if (explicitEmbedUrl) {
      embedUrl = explicitEmbedUrl;
    } else if (videoId) {
      embedUrl = 'https://www.youtube.com/embed/' + encodeURIComponent(videoId) + '?autoplay=1&rel=0';
    } else {
      // プレイリストURLは動画IDではなく list パラメータで埋め込む
      try {
        const parsed = new URL(selectedUrl);
        const listId = parsed.searchParams.get('list');
        if (listId) {
          embedUrl = 'https://www.youtube.com/embed/videoseries?list=' + encodeURIComponent(listId) + '&autoplay=1&rel=0';
        } else if (channelId) {
          // ライブ配信カードはGASからチャンネルIDが渡された場合に埋め込み再生
          embedUrl = 'https://www.youtube.com/embed/live_stream?channel=' + encodeURIComponent(channelId) + '&autoplay=1';
        }
      } catch (_) {}
    }

    if (!embedUrl) {
      // 再生できないURLでも、意図せずYouTubeへ遷移させない
      confirmPanel.querySelector('p').textContent =
        'この動画のHP内再生情報を取得できませんでした。GAS側から動画IDまたは埋め込みURLを渡す必要があります。';
      return;
    }

    confirmPanel.querySelector('p').textContent = 'この動画を再生しますか？';
    confirmPanel.hidden = true;
    playerPanel.hidden = false;
    const iframe = document.createElement('iframe');
    iframe.src = embedUrl;
    iframe.title = 'YouTube video player';
    iframe.referrerPolicy = 'strict-origin-when-cross-origin';
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    iframe.allowFullscreen = true;
    playerHost.appendChild(iframe);
  };

  // target=_blank の通常遷移や他スクリプトより先にクリックを捕まえる
  cards.forEach(card => card.addEventListener('click', event => {
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();
    const url = card.getAttribute('href') || card.href;
    if (!url) return;

    // スマホでは確認画面・埋め込み再生を挟まず、YouTubeへ直接移動
    if (window.matchMedia('(max-width: 760px)').matches) {
      window.open(url, '_blank', 'noopener,noreferrer');
      return;
    }

    // PCでは従来どおり、再生確認後にページ内プレイヤーを表示
    openConfirm(url);
  }, true));
  overlay.addEventListener('click', event => {
    const action = event.target.closest('[data-action]')?.dataset.action;
    if (action === 'play') play();
    if (action === 'cancel' || action === 'close') close();
    if (event.target === overlay) close();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && overlay.classList.contains('is-open')) close();
  });
})();
</script>



<script>
/* Mobile-only previous/next controls for the two featured videos */
(() => {
  if (!window.matchMedia('(max-width: 760px)').matches) return;
  const zone = document.querySelector('.hero-video-zone');
  if (!zone) return;
  const cards = [...zone.querySelectorAll('.hero-video-card')];
  if (cards.length < 2) return;
  let current = 0;
  const nav = document.createElement('div');
  nav.className = 'hero-video-mobile-nav';
  nav.setAttribute('aria-label', '動画を切り替える');
  const prev = document.createElement('button');
  prev.type = 'button'; prev.textContent = '＜'; prev.setAttribute('aria-label', '前の動画');
  const next = document.createElement('button');
  next.type = 'button'; next.textContent = '＞'; next.setAttribute('aria-label', '次の動画');
  nav.append(prev, next); zone.appendChild(nav);
  const show = (index) => {
    current = (index + cards.length) % cards.length;
    cards.forEach((card, i) => {
      card.classList.toggle('is-mobile-active', i === current);
      card.setAttribute('aria-hidden', i === current ? 'false' : 'true');
      if (i === current) card.removeAttribute('tabindex');
      else card.setAttribute('tabindex', '-1');
    });
  };
  prev.addEventListener('click', () => show(current - 1));
  next.addEventListener('click', () => show(current + 1));
  show(0);
})();
</script>

<!-- スクロール時のPROFILE表示 -->
<script>
(() => {
  const scene = document.querySelector('.hero-scroll-scene');
  const stage = document.querySelector('.hero-scroll-stage');

  if (!scene || !stage) return;

  if (window.matchMedia('(max-width: 760px)').matches) {
    stage.classList.add('is-revealed');
    return;
  }

  const update = () => {
    const rect = scene.getBoundingClientRect();
    const progress =
      -rect.top / (scene.offsetHeight - stage.offsetHeight);

    stage.classList.toggle('is-revealed', progress >= 0.05);
  };

  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);

  update();
})();
</script>
