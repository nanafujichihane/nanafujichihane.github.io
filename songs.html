
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SONG LIST | NAME</title>
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .song-badge-dam {
      display: inline-block;
      padding: 2px 7px;
      border: 1px solid #a65b5b;
      color: #a65b5b;
      font-size: 10px;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .dam-filter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .spreadsheet-link {
      color: #a65b5b;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .spreadsheet-link:hover {
      opacity: 0.75;
    }

    .spreadsheet-link .external-mark {
      display: inline-block;
      margin-left: 3px;
      font-size: 0.9em;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <a class="wordmark" href="index.html"><img src="assets/images/logo.png" alt="HOME" style="display:block; width:auto; height:auto; max-width:180px; max-height:42px; object-fit:contain;"></a>

    <button class="menu-toggle" aria-expanded="false" aria-controls="site-nav">
      MENU
    </button>

    <nav id="site-nav" class="site-nav">
      <a href="index.html">HOME</a>
      <a href="notes.html">NOTES</a>
      <a href="profile.html">PROFILE</a>
      <a href="costume.html">COSTUME</a>
      <a href="music.html">MUSIC</a>
      <a class="active" href="songs.html">SONG LIST</a>
      <a href="links.html">LINKS</a>
    </nav>
  </header>

  <main class="subpage">
    <header class="page-title songs-page-title">
      <h1>Song List</h1>
      <p class="muted">
        曲名・アーティスト名から検索できます。
      </p>

      <p class="muted note">
        ※曲名・アーティスト名は手作業で管理しているため、一部に表記ゆれや修正漏れがある場合があります。
      </p>

      <p class="muted note">
        <a class="spreadsheet-link" href="https://docs.google.com/spreadsheets/d/1YzaWv5jhWw5g4WlGiTigoUY5WplMLF_r0RVIow4hnpc/edit?usp=sharing" target="_blank" rel="noopener noreferrer">スプレッドシートで見たい方はこちら（絞り込み機能なし）<span class="external-mark" aria-hidden="true">↗</span></a>
      </p>
    </header>

    <div class="table-tools">
      <input
        id="song-search"
        type="search"
        placeholder="曲名・アーティスト名で検索"
      >

      <label class="dam-filter">
        <input id="exclude-dam" type="checkbox">
        YouTube音源のみ表示
      </label>
    </div>

    <div id="song-status" class="muted note">
      曲データを読み込んでいます…
    </div>

    <div class="table-wrap">
      <table class="song-table song-table-compact">
        <thead>
          <tr>
            <th data-sort="title">曲名 ↕</th>
            <th data-sort="artist">アーティスト ↕</th>
            <th data-sort="count">歌唱回数 ↕</th>
            <th>音源区分</th>
            <th data-sort="archiveDate">アーカイブ ↕</th>
          </tr>
        </thead>

        <tbody id="song-rows"></tbody>
      </table>
    </div>
  </main>

  <footer>
    <span>© NANAFUJI CHIHANE</span>
    <span>OFFICIAL WEBSITE</span>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/songs.js"></script>
</body>
</html>
