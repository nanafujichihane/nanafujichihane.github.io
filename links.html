<style>
/* LINKS page: desktop side-by-side tile layout */
.links-page .page-title {
  margin-bottom: 2.5rem;
}

.social-grid {
  width: 90%;
  max-width: 1120px;
  margin: 0 auto 5rem;
}

/* Mobile/tablet default: keep the existing stacked layout */
.social-grid-main,
.social-grid-sub {
  display: grid;
  gap: 12px;
}

.social-grid-main {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  margin-bottom: 12px;
}

.social-grid-sub {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.social-tile {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: flex-start;
  position: relative;
  min-width: 0;
  text-decoration: none;
  transition: background-color .2s ease, color .2s ease, border-color .2s ease;
}

.social-tile span,
.social-tile small {
  overflow-wrap: anywhere;
}

.social-tile-main .tile-name {
  display: block;
}

.social-tile-main .tile-description {
  display: block;
  max-height: 0;
  margin-top: 0;
  overflow: hidden;
  opacity: 0;
  font-size: .48em;
  line-height: 1.65;
  letter-spacing: .04em;
  transition: max-height .25s ease, margin-top .25s ease, opacity .2s ease;
}

.social-tile-main:hover .tile-description,
.social-tile-main:focus-visible .tile-description {
  max-height: 4em;
  margin-top: 9px;
  opacity: 1;
}

.social-tile b {
  align-self: flex-end;
  font-size: .85em;
  font-weight: 400;
  line-height: 1;
  opacity: .7;
}

.social-tile-main {
  aspect-ratio: 1 / .88;
  padding: clamp(14px, 2.2vw, 24px);
  background: var(--plum, #351c35);
  color: var(--white, #fffaf8);
  font-size: clamp(16px, 2vw, 23px);
}

.social-tile-sub {
  aspect-ratio: 1.2 / 1;
  padding: clamp(7px, 1.1vw, 13px);
  background: var(--lavender, #cdbdc9);
  color: var(--ink, #30232f);
  font-size: clamp(10px, 1.05vw, 13px);
}

/* Existing hover colors */
.social-tile-sub:hover,
.social-tile-sub:focus-visible {
  background: var(--plum, #351c35);
  color: var(--white, #fffaf8);
}

.social-tile-main:hover,
.social-tile-main:focus-visible {
  background: var(--mauve, #a98eaa);
  color: var(--ink, #30232f);
}

.social-tile:focus-visible {
  outline: 2px solid var(--mauve, #a98eaa);
  outline-offset: 3px;
}

/* Wide screens: 4 large tiles on the left, 9 small-tile slots on the right.
   Both groups share the same overall height. */
@media (min-width: 761px) {
  .social-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.18fr);
    align-items: stretch;
    gap: clamp(14px, 1.8vw, 24px);
    height: clamp(330px, 34vw, 440px);
  }

  .social-grid-main,
  .social-grid-sub {
    min-width: 0;
    height: 100%;
    margin: 0;
    gap: 12px;
  }

  .social-grid-main {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
  }

  .social-grid-sub {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(0, 1fr));
  }

  .social-tile-main,
  .social-tile-sub {
    aspect-ratio: auto;
    min-height: 0;
    padding: clamp(10px, 1.35vw, 19px);
  }

  .social-tile-main {
    font-size: clamp(15px, 1.45vw, 21px);
  }

  .social-tile-sub {
    font-size: clamp(10px, .9vw, 13px);
  }
}

@media (max-width: 600px) {
  .social-grid {
    width: 94%;
  }

  .social-grid-main,
  .social-grid-sub {
    gap: 8px;
  }

  .social-grid-main {
    margin-bottom: 8px;
  }

  .social-tile-main {
    padding: 12px;
    font-size: 16px;
  }

  .social-tile-sub {
    padding: 8px;
    font-size: 11px;
  }
}

@media (max-width: 380px) {
  .social-grid-sub {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
</style>
